        tr.appendChild(formatNode('td', grid.rowNumbers[index]));
        cells.forEach(function(cell) { tr.appendChild(formatNode('td', cell)); });
        table.appendChild(tr);
      });
      wrap.appendChild(table); parent.appendChild(wrap);
      state.formatGridTable = table;
    }

    function formatField(parent, label, value, onChange, type) {
      var wrap = formatNode('label', label + ' ');
      var input = formatNode('input'); input.type = type || 'text'; input.value = value;
        input.disabled = isMutationBusy() || Boolean(state.formatSaved);
      input.addEventListener('input', function() { onChange(input.value); });
      input.addEventListener('change', function() { onChange(input.value); });
      wrap.appendChild(input); parent.appendChild(wrap);
    }

    function formatColumnChoice(parent, role, title, proposal) {
      var diagnosis = state.formatDiagnosis;
      var current = state.formatAnswers.columns[role];
      var source = state.formatManualColumns && state.formatManualColumns[role] ?
        'MANUAL' : proposal.columns[role].source;
      var wrap = formatNode('label', title + '（' +
        (role === 'amountFallback' && !current ? 'なし' :
          source === 'REFERENCE' ? '参照ファイル' : source === 'HEADER' ? '見出し' :
          source === 'MANUAL' ? '手で選択' : '要選択') + '） ');
      var select = formatNode('select'); select.disabled = isMutationBusy() || Boolean(state.formatSaved);
      var none = formatNode('option', 'なし'); none.value = ''; select.appendChild(none);
      diagnosis.grid.columnLetters.forEach(function(letter, index) {
        var headerRowIndex = diagnosis.grid.rowNumbers.indexOf(Number(state.formatAnswers.headerRow));
        var header = (diagnosis.grid.cells[headerRowIndex] || [])[index] || '';
        var firstRow = diagnosis.grid.rowNumbers.indexOf(Number(state.formatAnswers.dataStartRow));
        var first = (diagnosis.grid.cells[firstRow] || [])[index] || '';
        var option = formatNode('option', letter + '「' + header + '」 ' + first);
        option.value = letter; select.appendChild(option);
      });
      select.value = current || '';
      state.formatColumnSelects.push(select);
      select.addEventListener('change', function() {
        formatUpdateAnswer(function() {
          state.formatAnswers.columns[role] = select.value || null;
          state.formatManualColumns[role] = true;
          wrap.firstChild.textContent = title + '（' +
            (role === 'amountFallback' && !select.value ? 'なし' : '手で選択') + '） ';
        });
      });
      wrap.appendChild(select); parent.appendChild(wrap);
    }

    function renderFormatInputs(parent, diagnosis) {
      var answers = state.formatAnswers;
      var proposal = diagnosis.proposal;
      state.formatColumnSelects = [];
      state.formatAmountLabels = [];
      var ackHost = formatNode('div');
      state.formatAcknowledgementHost = ackHost;
      renderFormatAcknowledgements(ackHost);
      parent.appendChild(ackHost);
      parent.appendChild(formatNode('h3', '列と形式の指定', 'subheading'));
      var fields = formatNode('div', null, 'action-row');
      formatField(fields, '見出し行', answers.headerRow, function(value) {
        formatUpdateAnswer(function() { answers.headerRow = Number(value); });
      }, 'number');
      formatField(fields, '明細の開始行', answers.dataStartRow, function(value) {
        formatUpdateAnswer(function() { answers.dataStartRow = Number(value); });
      }, 'number');
      formatField(fields, '形式 ID', answers.formatId, function(value) {
        formatUpdateAnswer(function() { answers.formatId = value; });
      });
      formatField(fields, '形式名', answers.formatName, function(value) {
        formatUpdateAnswer(function() { answers.formatName = value; });
      });
      parent.appendChild(fields);
      var columnFields = formatNode('div', null, 'action-row');
      formatColumnChoice(columnFields, 'date', '利用日', proposal);
      formatColumnChoice(columnFields, 'merchant', '店名', proposal);
      formatColumnChoice(columnFields, 'purpose', '使用用途', proposal);
      formatColumnChoice(columnFields, 'amountFallback', '予備金額', proposal);
      parent.appendChild(columnFields);
      parent.appendChild(formatNode('h3', '金額の列', 'subheading'));
      if (proposal.amountCandidates.length >= 2) {
        var list = formatNode('div');
        var candidates = formatAmountChoices(proposal, answers, diagnosis.grid);
        candidates.forEach(function(candidate) {
          var label = formatNode('label');
          var radio = formatNode('input'); radio.type = 'radio'; radio.name = 'format-amount';
          radio.value = candidate.column; radio.checked = answers.columns.amount === candidate.column;
          radio.disabled = isMutationBusy() || Boolean(state.formatSaved);
          radio.addEventListener('change', function() {
            formatUpdateAnswer(function() {
              answers.columns.amount = candidate.column;
              state.formatManualColumns.amount = true;
            });
          });
          label.appendChild(radio);
          var comparison = state.formatPreview && state.formatPreview.extraction &&
            state.formatPreview.amountComparison || [];
          var compared = comparison.filter(function(item) {
            return item.column === candidate.column;
          })[0];
          if (!compared && state.formatPreview && state.formatPreview.extraction &&
              candidate.column === answers.columns.amount)
            compared = {total: state.formatPreview.extraction.total, differsRows: 0};
          var first = (diagnosis.grid.cells[diagnosis.grid.rowNumbers.indexOf(
            Number(answers.dataStartRow))] || [])[ 
            diagnosis.grid.columnLetters.indexOf(candidate.column)];
          var amountSpan = formatNode('span', candidate.column + '「' + candidate.header + '」 ' +
            (first || '') + (compared ? ' 合計 ' + formatAmount(compared.total) +
              ' 相違 ' + compared.differsRows + ' 行' : ''));
          label.appendChild(amountSpan);
          state.formatAmountLabels.push({column: candidate.column, span: amountSpan});
          list.appendChild(label); list.appendChild(formatNode('br'));
        });
        parent.appendChild(list);
      } else {
        formatColumnChoice(parent, 'amount', '金額', proposal);
      }
      var ack = answers.acknowledgements;
      var actions = formatNode('div', null, 'action-row');
      var previewButton = formatButton('試し読み', previewFormat, true);
      previewButton.disabled = isMutationBusy() || Boolean(state.formatSaved);
      actions.appendChild(previewButton);
      var save = formatButton('保存して有効にする', saveFormat, true);
      save.disabled = isMutationBusy() || Boolean(state.formatSaved) || !formatCanSave(state.formatPreview,
        state.formatHash, ack);
      state.formatSaveButton = save;
      actions.appendChild(save); parent.appendChild(actions);
    }

    function renderFormatAcknowledgements(parent) {
      var diagnosis = state.formatDiagnosis;
      var answers = state.formatAnswers;
      var proposal = diagnosis.proposal;
      var ack = answers.acknowledgements;
      var purpose = formatPurposeAcknowledgement(diagnosis, answers);
      state.formatAcknowledgementSignature = formatAcknowledgementSignature();
      if (diagnosis.customerSide)
        formatAppendLine(parent, 'この形のファイルを形式として登録すると、顧客の入力ミスが正常な様式として定着します。通常は顧客に修正を依頼してください。', 'format-message warning');
      if (answers.columns.purpose && formatNormalizeHeader(purpose.header) !==
          formatNormalizeHeader('使用用途'))
        formatAppendLine(parent, answers.columns.purpose + '列（見出し「' + purpose.header +
          '」）を使用用途として読みます。この列にカード会社が書いた文言も、使用用途として転記されます。', 'format-message warning');
      if (purpose.required) {
        var customerAck = formatNode('label');
        var check = formatNode('input'); check.type = 'checkbox'; check.checked = ack.customerSide;
        check.disabled = isMutationBusy() || Boolean(state.formatSaved);
        check.addEventListener('change', function() {
          formatUpdateAnswer(function() { ack.customerSide = check.checked; }, true);
        });
        customerAck.appendChild(check);
        customerAck.appendChild(formatNode('span', '入力ミスを様式として登録することを理解した'));
        parent.appendChild(customerAck);
      }
      if (proposal.amountCandidates.length >= 2) {
        var amountAck = formatNode('label');
        var amountCheck = formatNode('input'); amountCheck.type = 'checkbox';
        amountCheck.checked = ack.amountChoice;
        amountCheck.disabled = isMutationBusy() || Boolean(state.formatSaved);
        amountCheck.addEventListener('change', function() {
          formatUpdateAnswer(function() { ack.amountChoice = amountCheck.checked; }, true);
        });
        amountAck.appendChild(amountCheck);
        amountAck.appendChild(formatNode('span', '金額の列を確認した'));
        parent.appendChild(amountAck);
      }
    }

    function formatAcknowledgementSignature() {
      var d = state.formatDiagnosis, a = state.formatAnswers;
      if (!d || !a || !d.proposal) return '';
      var purpose = formatPurposeAcknowledgement(d, a);
      return JSON.stringify([d.customerSide, purpose.required, purpose.header,
        a.columns.purpose, d.proposal.amountCandidates.length,
        a.acknowledgements.customerSide, a.acknowledgements.amountChoice]);
    }

    function renderFormatPreview(parent) {
      var result = state.formatPreview;
      if (!result) return;
      parent.appendChild(formatNode('h3', '試し読みの結果', 'subheading'));
      (result.blocking || []).forEach(function(item) {
        formatAppendLine(parent, formatBlockingMessage(item.code, item.detail), 'format-message blocking');
      });
      if (result.extraction) {
        var extraction = result.extraction;
        formatAppendLine(parent, extraction.count + ' 件、合計 ' + formatAmount(extraction.total) +
          ' 円、区分の見込み ' + (extraction.category.category || 'なし'));
        if (extraction.category.category === 1)
          formatAppendLine(parent, 'このまま取り込むと【要修正】になります。', 'format-message warning');
        var wrap = formatNode('div', null, 'table-wrap'); var table = formatNode('table');
        var head = formatNode('tr');
        ['行', '利用日', '金額', '店名', '使用用途'].forEach(function(v) {
          head.appendChild(formatNode('th', v));
        }); table.appendChild(head);
        extraction.rows.forEach(function(row) {
          var tr = formatNode('tr');
          if (!row.amount || !row.purpose) tr.className = 'format-warning';
          [row.sourceRow, row.date || '', formatAmount(row.amount), row.merchant,
            row.purpose].forEach(function(value) { tr.appendChild(formatNode('td', value)); });
          table.appendChild(tr);
        });
        wrap.appendChild(table); parent.appendChild(wrap);
        if (extraction.moreRows)
          formatAppendLine(parent, '表示しなかった明細が ' + extraction.moreRows + ' 行あります。');
        if (extraction.excluded.length) {
          parent.appendChild(formatNode('h4', '除外した行'));
          var excludedTable = formatNode('table');
          var excludedHead = formatNode('tr');
          ['行', '理由', '中身'].forEach(function(label) {
            excludedHead.appendChild(formatNode('th', label));
          });
          excludedTable.appendChild(excludedHead);
          extraction.excluded.forEach(function(item) {
            var tr = formatNode('tr');
            [item.sourceRow, formatExcludedReason(item.ruleId),
              (item.cells || []).join(' ／ ')].forEach(function(value) {
              tr.appendChild(formatNode('td', value));
            });
            excludedTable.appendChild(tr);
          });
          parent.appendChild(excludedTable);
        }
        formatAppendLine(parent, '請求年月 ' +
          (extraction.billing.yearMonth || '読めません') + '。年のない日付 ' +
          extraction.year.yearless + ' 行のうち ' + extraction.year.inferred +
          ' 行で年を補完しました。年を確認する行は ' + extraction.year.reviewRows + ' 行です。');
      }
      (result.warnings || []).forEach(function(item) {
        formatAppendLine(parent, formatWarningMessage(item.code, item.detail), 'format-message warning');
      });
    }

    function renderFormatSaved(parent) {
      var saved = state.formatSaved;
      if (!saved || saved.saved !== true) return;
      if (saved.readback === 'UNCERTAIN') {
        if (saved.disabled) {
          formatAppendLine(parent, '保存後の確認を終えられなかったので、安全のため無効にしました。' +
            '形式 ID を変えてやり直してください（同じ ID は使えません）。', 'format-message blocking');
          parent.appendChild(formatButton('形式 ID を変えてやり直す', function() {
            state.formatSaved = null; invalidateFormatPreview(); renderFormatPanel();
          }));
        } else {
          formatAppendLine(parent, '保存後の確認を終えられず、無効にもできませんでした。' +
            'この登録を取り消すか、管理者に確認してください。', 'format-message blocking');
          parent.appendChild(formatButton('この登録を取り消す', withdrawFormat));
        }
        return;
      }
      if (saved.readback === 'MISMATCH') {
        formatAppendLine(parent, '保存した行を読み直すと結果が違ったので、この形式を無効にしました。' +
          ' 行の値：' + (saved.diff && saved.diff.cells ? '一致' : '不一致') +
          '、明細：' + (saved.diff && saved.diff.extraction ? '一致' : '不一致') +
          '、形式判定：' + (saved.diff && saved.diff.detection ? '一致' : '不一致') +
          '。形式 ID を変えてやり直してください（同じ ID は使えません）。', 'format-message blocking');
        parent.appendChild(formatButton('形式 ID を変えてやり直す', function() {
          state.formatSaved = null; invalidateFormatPreview(); renderFormatPanel();
        }));
        return;
      }
      formatAppendLine(parent, '保存しました。保存した行から読み直した結果も一致しました。' +
        saved.after.count + ' 件、合計 ' + formatAmount(saved.after.total) + ' 円。');
      if (saved.siblingsError)
        formatAppendLine(parent, '同じフォルダのファイルを確かめられませんでした。',
          'format-message warning');
      var siblingIds = state.formatSelectedIds;
      if (!state.formatRequeueRemaining) {
        var targetLabel = formatNode('label');
        var targetCheck = formatNode('input');
        targetCheck.type = 'checkbox'; targetCheck.checked = siblingIds.indexOf(state.formatFileId) >= 0;
        targetCheck.disabled = isMutationBusy();
        targetCheck.addEventListener('change', function() {
          if (targetCheck.checked && siblingIds.indexOf(state.formatFileId) < 0)
            siblingIds.push(state.formatFileId);
          else if (!targetCheck.checked) siblingIds = siblingIds.filter(function(id) {
            return id !== state.formatFileId;
          });
          state.formatSelectedIds = siblingIds;
        });
        targetLabel.appendChild(targetCheck);
        targetLabel.appendChild(formatNode('span', state.formatDiagnosis.fileName + '：登録した形式に一致'));
        parent.appendChild(targetLabel); parent.appendChild(formatNode('br'));
      }
      var visibleSiblings = state.formatRequeueRemaining ?
        (saved.siblings || []).filter(function(item) {
          return item.fileId !== state.formatFileId && siblingIds.indexOf(item.fileId) >= 0;
        }) : (saved.siblings || []);
      visibleSiblings.forEach(function(sibling) {
        var label = formatNode('label'); var check = formatNode('input');
        check.type = 'checkbox'; check.checked = siblingIds.indexOf(sibling.fileId) >= 0;
        check.disabled = isMutationBusy() || sibling.verdict !== 'MATCHES_NEW';
        check.addEventListener('change', function() {
          if (check.checked && siblingIds.indexOf(sibling.fileId) < 0) siblingIds.push(sibling.fileId);
          else siblingIds = siblingIds.filter(function(id) { return id !== sibling.fileId; });
          state.formatSelectedIds = siblingIds;
        });
        label.appendChild(check);
        label.appendChild(formatNode('span', sibling.fileName + '：' + ({
          MATCHES_NEW: 'この形式で読めます', MATCHES_OTHER: '別の登録済みの形式で読めます',
          NO_MATCH: 'まだどの形式にも当たりません', AMBIGUOUS: '2 つ以上の形式に当たります'
        }[sibling.verdict] || sibling.verdict)));
        parent.appendChild(label); parent.appendChild(formatNode('br'));
      });
      if (!state.formatRequeueRemaining && saved.siblingsNotRead && saved.siblingsNotRead.length)
        formatAppendLine(parent, 'まだ確認していないファイル：' + saved.siblingsNotRead.length + ' 件');
      var actions = formatNode('div', null, 'action-row');
      actions.appendChild(formatButton('選んだファイルを取込待ちに戻す', function() {
        requeueFormat(siblingIds);
      }, true));
      if (!state.formatRequeueRemaining)
        actions.appendChild(formatButton('この登録を取り消す', withdrawFormat));
      parent.appendChild(actions);
    }

    function renderFormatPanel() {
      var d = state.formatDiagnosis;
      state.formatPanelBusySignature = String(isMutationBusy());
      el['format-panel'].hidden = !state.formatFileId;
      el['format-close'].disabled = isMutationBusy();
      el['format-body'].textContent = '';
      if (!state.formatFileId) return;
      var body = el['format-body'];
      state.formatMessageHost = formatNode('div');
      if (state.formatMessage) {
        formatAppendLine(state.formatMessageHost, state.formatMessage.text,
          'format-message ' + state.formatMessage.kind);
        (state.formatMessage.details || []).forEach(function(detail) {
          formatAppendLine(state.formatMessageHost, detail,
            'format-message ' + state.formatMessage.kind);
        });
      }
      body.appendChild(state.formatMessageHost);
      if (state.formatBusy) formatAppendLine(body, '処理中…');
      if (!d) return;
      if (!d.ok) { formatAppendLine(body, formatBlockingMessage(d.code), 'format-message warning'); return; }
      if (state.formatRequeueRemaining) {
        formatAppendLine(body, '取込待ちへ戻す残りのファイルを確認しました。');
        renderFormatSaved(body); return;
      }
      formatAppendLine(body, d.verdict === 'MATCHES_ACTIVE' || d.verdict === 'AMBIGUOUS' ?
        d.fileName : d.fileName + ' ／ ' + (d.sheetName || '') + ' ／ ' + (d.width || '') + ' 列');
      if (d.verdict === 'MATCHES_ACTIVE') {
        formatAppendLine(body, 'このファイルは、登録済みの形式「' + d.matched.formatName +
          '」で読めます（止まった後に形式が足されたか、判定が直りました）。');
        body.appendChild(formatButton('登録済みの形式で再検査する', function() {
          requeueFormat([d.fileId]);
        }, true));
        if (state.formatUncertainSaveId &&
            String(d.matched.formatId) === String(state.formatUncertainSaveId))
          body.appendChild(formatButton('この登録を取り消す', withdrawFormat));
        return;
      }
      if (d.verdict === 'AMBIGUOUS') {
        formatAppendLine(body, 'このファイルは 2 つ以上の形式に当たります。スプレッドシートのメニューから扱ってください。');
        return;
      }
      if (d.verdict === 'NEAR')
        formatAppendLine(body, 'いちばん近い形式は「' + d.nearest[0].formatName +
          '」です。違い：' + formatGapText(d.nearest[0].gapText));
      else formatAppendLine(body, '近い形式がありません。列を指定して、新しい形式として登録します。');
      (d.warnings || []).forEach(function(item) {
        formatAppendLine(body, formatWarningMessage(item.code, item.detail),
          'format-message warning');
      });
      if (d.customerSide) {
        var chosen = (d.nearest || []).filter(function(item) {
          return item.formatId === d.proposal.baseFormatId;
        })[0] || d.nearest[0];
        if (d.purposeGap.kind === 'PURPOSE_COLUMN_ABSENT')
          formatAppendLine(body, '違いは「使用用途」の列だけです。カード会社の出力は「' +
            chosen.formatName + '」と同じで、顧客が「使用用途」の列を足していません。');
        else formatAppendLine(body, '違いは「使用用途」の列だけです。' + d.purposeGap.column +
          '列の見出しが「' + d.purposeGap.headerText +
          '」になっています。顧客が見出しのセルに用途を書いた可能性があります。');
        if (!state.formatRegistrationOpen) {
          formatActionOrder(true).forEach(function(action) {
            if (action === 'RETURN_TO_CUSTOMER' && !state.formatSaved)
              body.appendChild(formatButton('顧客に修正を依頼する（【要修正】にする）', returnFormatToCustomer, true));
            else body.appendChild(formatButton('別の形式として登録する…', function() {
              state.formatRegistrationOpen = true; renderFormatPanel();
            }));
            body.appendChild(formatNode('br'));
          });
        } else {
          if (!state.formatSaved) body.appendChild(formatButton(
            '顧客に修正を依頼する（【要修正】にする）', returnFormatToCustomer, true));
        }
      }
      if (d.verdict === 'NEAR') {
        var selector = formatNode('select');
        d.nearest.forEach(function(item) {
          var option = formatNode('option', item.formatName + '：' + formatGapText(item.gapText));
          option.value = item.formatId; selector.appendChild(option);
        });
        selector.value = d.proposal.baseFormatId;
        selector.disabled = isMutationBusy() || Boolean(state.formatSaved);
        selector.addEventListener('change', function() {
          openFormat(d.fileId, selector.value, state.formatRegistrationOpen);
        });
        body.appendChild(selector);
      }
      if (d.customerSide && !state.formatRegistrationOpen) return;
      renderFormatGrid(body, d);
      renderFormatInputs(body, d);
      var previewHost = formatNode('div');
      state.formatPreviewHost = previewHost;
      renderFormatPreview(previewHost);
      body.appendChild(previewHost);
      renderFormatSaved(body);
    }

    function formatSetBusy(busy) {
      state.formatBusy = busy;
      renderFiles();
      renderFolders();
      document.querySelectorAll('.review-select, .partner-input').forEach(function(node) {
        node.disabled = isMutationBusy();
      });
      el['review-prev'].disabled = state.loadingReviews || isMutationBusy() || state.reviewOffset <= 0;
      el['review-next'].disabled = state.loadingReviews || isMutationBusy() ||
        state.reviewOffset + state.reviewLimit >= state.partnerTotal;
      updateActionButtons();
      try { renderFormatPanel(); }
      catch (error) {
        el['format-body'].textContent = '';
        formatAppendLine(el['format-body'], '形式の画面を表示できませんでした。' +
          failureMessage(error), 'format-message blocking');
      }
    }

    function formatShowMessage(message, kind, details) {
      state.formatMessage = {text: message, kind: kind || 'warning', details: details || []};
      if (!state.formatMessageHost) return;
      state.formatMessageHost.textContent = '';
      formatAppendLine(state.formatMessageHost, message,
        'format-message ' + (kind || 'warning'));
      (details || []).forEach(function(detail) {
        formatAppendLine(state.formatMessageHost, detail,
          'format-message ' + (kind || 'warning'));
      });
    }

    function closeFormatPanel() {
      state.formatFileId = null; state.formatDiagnosis = null;
      state.formatAnswers = null; state.formatSaved = null;
      state.formatUncertainSaveId = null;
      state.formatManualColumns = {}; state.formatMessage = null;
      state.formatSelectedIds = []; state.formatRequeueRemaining = false;
      invalidateFormatPreview();
    }

    async function openFormat(fileId, baseFormatId, keepRegistrationOpen) {
      if (isMutationBusy()) return;
      if (state.formatSaved && !await formatConfirm('保存結果を閉じる',
          '保存結果と取り消しの操作を閉じます。続けますか。')) return;
      var request = ++state.formatRequest;
      var customerId = state.selectedCustomerId, folderId = state.selectedFolderId;
      state.formatFileId = fileId; state.formatDiagnosis = null;
      state.formatSaved = null; state.formatRequeueRemaining = false;
      state.formatUncertainSaveId = null;
      state.formatManualColumns = {}; state.formatMessage = null;
      invalidateFormatPreview();
      formatSetBusy(true);
      el['format-panel'].scrollIntoView({behavior: 'smooth', block: 'start'});
      try {
        var result = await gasCall('webAppExplainUnknownFile',
          [customerId, folderId, fileId, baseFormatId || null]);
        if (request !== state.formatRequest || customerId !== state.selectedCustomerId ||
            folderId !== state.selectedFolderId) return;
        if (!result || result.ok === false) {
          formatShowMessage(formatBlockingMessage(result && result.code), 'blocking');
          await refreshFormatLists();
          return;
        }
        state.formatDiagnosis = result;
        state.formatRegistrationOpen = Boolean(keepRegistrationOpen || !result.customerSide);
        state.formatAnswers = result.proposal ? formatAnswersFromProposal(result.proposal) : null;
      } catch (error) { formatShowMessage(failureMessage(error), 'blocking'); }
      finally { formatSetBusy(false); }
    }

    async function previewFormat() {
      if (isMutationBusy() || !state.formatAnswers || state.formatSaved) return;
      var missingColumn = formatRequiredColumnMessage(state.formatAnswers);
      if (missingColumn) { formatShowMessage(missingColumn, 'warning'); return; }
      var sentAnswers = JSON.stringify(state.formatAnswers);
      invalidateFormatPreview(); formatSetBusy(true);
      try {
        var result = await gasCall('webAppPreviewFormat',
          [state.selectedCustomerId, state.selectedFolderId, state.formatFileId, state.formatAnswers]);
        if (!formatPreviewIsCurrent(sentAnswers, state.formatAnswers)) return;
        if (!result || result.ok === false) {
          formatShowMessage(formatBlockingMessage(result && result.code), 'blocking');
          await refreshFormatLists(); return;
        }
        var view = formatPreviewView(result, state.formatDiagnosis);
        state.formatPreview = view.preview; state.formatHash = view.hash;
        if (view.notice) formatShowMessage(view.notice, 'blocking');
      } catch (error) { formatShowMessage(failureMessage(error), 'blocking'); }
      finally { formatSetBusy(false); }
    }

    async function saveFormat() {
      if (isMutationBusy() || !formatCanSave(state.formatPreview,
          state.formatHash, state.formatAnswers.acknowledgements)) return;
      var answers = state.formatAnswers;
      if (!await formatConfirm('形式を保存', 'カード形式マスターに「' + answers.formatName + '」（' + answers.formatId +
          '）を追加し、有効にします。形式は全顧客に共通です。次の取込から、この形に合うファイルはすべてこの形式で読まれます。')) return;
      formatSetBusy(true);
      var uncertain = false;
      try {
        var result = await gasCall('webAppSaveFormat', [state.selectedCustomerId,
          state.selectedFolderId, state.formatFileId, answers, state.formatHash]);
        var outcome = formatSaveResult(result);
        formatApplySaveFailure(result);
        if (outcome.notice) formatShowMessage(outcome.notice, 'blocking');
        if (outcome.close) { invalidateFormatPreview(); await refreshFormatLists(); }
        if (outcome.saved) {
          state.formatSaved = outcome.saved;
          state.formatRequeueRemaining = false;
          state.formatSelectedIds = result.readback === 'OK' ?
            [state.formatFileId].concat((result.siblings || [])
              .filter(function(item) { return item.verdict === 'MATCHES_NEW'; })
              .map(function(item) { return item.fileId; })) : [];
        }
      } catch (error) {
        invalidateFormatPreview();
        uncertain = true;
      }
      finally { formatSetBusy(false); }
      if (uncertain) {
        var fileId = state.formatFileId;
        var baseId = state.formatAnswers && state.formatAnswers.baseFormatId;
        var attemptedId = answers.formatId;
        await openFormat(fileId, baseId, state.formatRegistrationOpen);
        if (state.formatDiagnosis && state.formatDiagnosis.verdict === 'MATCHES_ACTIVE' &&
            state.formatDiagnosis.matched &&
            String(state.formatDiagnosis.matched.formatId) === String(attemptedId)) {
          state.formatUncertainSaveId = attemptedId;
          renderFormatPanel();
        }
        formatShowMessage('保存できたか確かめられません。診断し直してください。', 'blocking');
      }
    }

    function formatConfirm(title, message) {
      return new Promise(function(resolve) {
        state.formatConfirmResolve = resolve;
        el['confirm-title'].textContent = title;
        el['confirm-intro'].textContent = message;
        el['confirm-list'].textContent = '';
        el['confirm-submit'].textContent = '実行する';
        if (typeof el['confirm-dialog'].showModal === 'function')
          el['confirm-dialog'].showModal();
        else el['confirm-dialog'].setAttribute('open', 'open');
      });
    }

    async function requeueFormat(fileIds) {
      if (isMutationBusy() || !fileIds.length) return;
      if (!await formatConfirm('取込待ちへ戻す', '選んだ ' + fileIds.length +
          ' 件を取込待ちに戻します。［記帳を実行］で取り込みます。')) return;
      formatSetBusy(true);
      try {
        var result = await gasCall('webAppRequeueFormatFiles',
          [state.selectedCustomerId, state.selectedFolderId, fileIds]);
        if (!result || result.ok === false) {
          formatShowMessage(formatBlockingMessage(result && result.code), 'blocking');
          await refreshFormatLists(); return;
        }
        var skippedDetails = (result.skipped || []).map(function(item) {
            var sibling = state.formatSaved && (state.formatSaved.siblings || []).filter(function(s) {
              return s.fileId === item.fileId;
            })[0];
            var name = sibling && sibling.fileName ||
              (state.formatDiagnosis && state.formatDiagnosis.fileId === item.fileId ?
                state.formatDiagnosis.fileName : item.fileId);
            return name + '：' + ({STILL_UNKNOWN: 'まだどの形式にも当たりません。',
              AMBIGUOUS: '2 つ以上の形式に当たります。',
              NOT_FORMAT_UNKNOWN: '形式不明の要確認がありません（既に扱われた可能性があります）。',
              REQUEUE_FAILED: '読み直しの途中でエラーになりました。もう一度お試しください。'}[
                item.code] || item.code);
          });
        formatShowMessage(formatRequeueMessage(result),
          result.requeued.length ? 'success' : 'warning', skippedDetails);
        if (!result.remaining || !result.remaining.length)
          showNotice(formatRequeueMessage(result),
            result.requeued.length ? 'success' : 'warning', skippedDetails);
        if (result.remaining && result.remaining.length) {
          state.formatSelectedIds = result.remaining.slice();
          state.formatRequeueRemaining = true;
        } else closeFormatPanel();
        await refreshFormatLists();
      } catch (error) {
        formatShowMessage(failureMessage(error), 'blocking');
        await refreshFormatLists();
      }
      finally { formatSetBusy(false); }
    }

    async function returnFormatToCustomer() {
      var d = state.formatDiagnosis;
      if (isMutationBusy() || !d || state.formatSaved) return;
      if (!await formatConfirm('顧客に修正を依頼', '「' + d.fileName +
          '」を【要修正】にします。顧客が直したファイルを置き直すまで取り込みません。')) return;
      var reason = d.purposeGap.kind === 'PURPOSE_COLUMN_ABSENT' ?
        'PURPOSE_COLUMN_MISSING' : d.purposeGap.kind;
      formatSetBusy(true);
      try {
        var result = await gasCall('webAppReturnFileToCustomer',
          [state.selectedCustomerId, state.selectedFolderId, d.fileId, reason, '']);
        if (result.returned) {
          showNotice('【要修正】にしました。', 'success');
          closeFormatPanel();
          await refreshFormatLists();
        } else {
          formatShowMessage(formatBlockingMessage(result.code), 'blocking');
          await refreshFormatLists();
        }
      } catch (error) { formatShowMessage(failureMessage(error), 'blocking'); }
      finally { formatSetBusy(false); }
    }

    async function withdrawFormat() {
      var d = state.formatDiagnosis;
      var a = state.formatAnswers;
      var formatId = state.formatSaved && state.formatSaved.formatId ||
        d && d.verdict === 'MATCHES_ACTIVE' && d.matched &&
        String(d.matched.formatId) === String(state.formatUncertainSaveId) &&
        state.formatUncertainSaveId;
      if (isMutationBusy() || !formatId) return;
      if (!await formatConfirm('形式を取り消す', '「' +
          (a && a.formatName || d && d.matched && d.matched.formatName || formatId) +
          '」を無効にします。取り込み済みの取引は変わりません。次の取込から、この形式で読めていたファイルは形式不明で止まります。')) return;
      formatSetBusy(true);
      try {
        var result = await gasCall('webAppWithdrawFormat',
          [state.selectedCustomerId, formatId]);
        if (result.withdrawn) {
          showNotice('形式を無効にしました。', 'success');
          closeFormatPanel();
        } else formatShowMessage(formatBlockingMessage(result.code), 'blocking');
        await refreshFormatLists();
      } catch (error) { formatShowMessage(failureMessage(error), 'blocking'); }
      finally { formatSetBusy(false); }
    }

    async function refreshFormatLists() {
      await Promise.all([
        loadFiles(state.selectedCustomerId, state.selectedFolderId, state.viewGeneration),
        loadReviews(state.selectedCustomerId, 0, state.viewGeneration)
      ]);
    }


    async function bootstrap() {
      var generation = ++state.viewGeneration;
      try {
        var result = await gasCall('webAppBootstrap', []);
        if (generation !== state.viewGeneration) return;
        state.actor = result.actor || '';
        state.version = result.version || '';
        state.customers = Array.isArray(result.customers) ? result.customers : [];
        el.actor.textContent = '実行者: ' + state.actor;
        el.version.textContent = state.version ? 'バージョン ' + state.version : '';
        renderSelection();
      } catch (error) {
        if (generation !== state.viewGeneration) return;
        el['customer-count'].textContent = '0 件';
        showNotice(failureMessage(error), 'error');
      }
    }

    el['customer-search'].addEventListener('input', renderCustomers);
    el['format-close'].addEventListener('click', async function() {
      if (isMutationBusy()) return;
      if (state.formatSaved && !await formatConfirm('保存結果を閉じる',
          '保存結果と取り消しの操作を閉じます。続けますか。')) return;
      state.formatRequest += 1;
      closeFormatPanel(); renderFormatPanel();
    });
    el['import-button'].addEventListener('click', startImport);
    el['resolve-button'].addEventListener('click', openConfirmation);
    el['review-prev'].addEventListener('click', function() {
      if (state.loadingReviews || isMutationBusy()) return;
      loadReviews(state.selectedCustomerId, Math.max(0, state.reviewOffset - state.reviewLimit), state.viewGeneration);
    });
    el['review-next'].addEventListener('click', function() {
      if (state.loadingReviews || isMutationBusy()) return;
      loadReviews(state.selectedCustomerId, state.reviewOffset + state.reviewLimit, state.viewGeneration);
    });
    el['final-button'].addEventListener('click', loadFinalReview);
    el['excel-button'].addEventListener('click', downloadExcel);
    el['confirm-cancel'].addEventListener('click', function() {
      if (state.formatConfirmResolve) {
        var resolve = state.formatConfirmResolve;
        state.formatConfirmResolve = null;
        closeConfirmation(); resolve(false); return;
      }
      state.confirmPayload = null;
      closeConfirmation();
    });
    el['confirm-dialog'].addEventListener('cancel', function() {
      if (state.formatConfirmResolve) {
        var resolve = state.formatConfirmResolve;
        state.formatConfirmResolve = null;
        resolve(false);
      } else state.confirmPayload = null;
    });
    el['confirm-submit'].addEventListener('click', function() {
      if (state.formatConfirmResolve) {
        var resolve = state.formatConfirmResolve;
        state.formatConfirmResolve = null;
        closeConfirmation(); resolve(true); return;
      }
      startResolve();
    });
    document.querySelectorAll('[data-coming-soon]').forEach(function(button) {
      button.addEventListener('click', function() { showNotice(TEXT.comingSoon, 'info'); });
    });

    renderSelection();
    bootstrap();
  }());
  </script>
</body>
</html>
